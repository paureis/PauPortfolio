name: Build and deploy

# Every push to any branch runs the checks and the build. Deploys are gated
# separately: a push to main deploys production, and a pull request gets its
# own preview environment on Azure Static Web Apps, removed when it closes.
# A push to a branch that has an open pull request runs Build twice, once
# per event; that is the cost of checking every push while previews still
# need the pull_request event.

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Includes the required manifest/artifact gate and its negative fixtures.
      - name: Typecheck, lint, content, scene manifest and regression tests
        run: npm run check

      - name: Build static export
        run: npm run build

      - name: Add the Static Web Apps config to the export
        run: cp staticwebapp.config.json out/

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          retention-days: 1

  deploy-production:
    name: Deploy production
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out

      - name: Deploy to production
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: out
          skip_app_build: true
          skip_api_build: true

  deploy-preview:
    name: Deploy preview
    needs: build
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out

      - name: Deploy preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: out
          skip_app_build: true
          skip_api_build: true

  close-preview:
    name: Remove preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
